name: VDR validation
on:
  push:
    branches: [validation/vdr-20261125]
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install python-dateutil
      - run: python -m unittest discover -s server/test/pr_vdr_units -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Android and run existing JVM tests
        working-directory: android
        run: ./gradlew testBetaUnitTest -x buildViewerRelease --no-daemon
